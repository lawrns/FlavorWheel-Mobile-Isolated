name: 🚀 World-Class Testing Pipeline

on:
  push:
    branches: [ main, develop, mobile-deploy-v1 ]
  pull_request:
    branches: [ main, develop, mobile-deploy-v1 ]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level'
        required: true
        default: 'full'
        type: choice
        options:
          - quick
          - standard
          - full
          - performance
          - security
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: false

jobs:
  # 🏗️ FOUNDATION TESTS
  foundation-tests:
    name: '🏗️ Foundation Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18, 20]
        test-type: ['unit', 'lint', 'type-check']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 🔍 TypeScript type checking
        run: npm run type-check
        if: matrix.test-type == 'type-check'

      - name: 🎨 Code linting
        run: npm run lint
        if: matrix.test-type == 'lint'

      - name: 🧪 Unit tests
        run: npm run test:unit
        if: matrix.test-type == 'unit'

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: |
            test-results/
            coverage/
            playwright-report/

  # 🧪 COMPREHENSIVE UNIT TESTING
  unit-tests:
    name: '🧪 Comprehensive Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: foundation-tests

    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      supabase:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗃️ Setup test database
        run: |
          npm run db:generate-types
          npm run db:migrate
          npm run db:seed

      - name: 🧪 Run unit tests with coverage
        run: |
          npm run test:unit -- --shard=${{ matrix.shard }}/4 --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unit-tests-shard-${{ matrix.shard }}
          name: unit-tests-shard-${{ matrix.shard }}

  # 🔧 INTEGRATION TESTS
  integration-tests:
    name: '🔧 Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      supabase:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 🗃️ Setup integration database
        run: |
          npm run db:generate-types
          npm run db:migrate
          npm run db:seed

      - name: 🔧 Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integration_test_db
          REDIS_URL: redis://localhost:6379
          SUPABASE_URL: http://localhost:54322
          SUPABASE_ANON_KEY: test-anon-key

      - name: 📊 Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  # 🌐 END-TO-END TESTS
  e2e-tests:
    name: '🌐 End-to-End Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration-tests

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
        include:
          - browser: chromium
            shard: 1
          - browser: chromium
            shard: 2
          - browser: chromium
            shard: 3
          - browser: firefox
            shard: 1
          - browser: webkit
            shard: 1

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 🏗️ Build application
        run: npm run build

      - name: 🗃️ Setup test database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: 🌐 Run E2E tests
        run: |
          npm run test:e2e -- --shard=${{ matrix.shard }}/3 --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001

      - name: 📊 Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: test-results/screenshots/

  # 📱 MOBILE RESPONSIVENESS TESTS
  mobile-tests:
    name: '📱 Mobile Responsiveness Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-tests

    strategy:
      matrix:
        device: ['iPhone 12', 'Pixel 5', 'iPad Pro']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps

      - name: 📱 Run mobile tests
        run: |
          npx playwright test __tests__/e2e/mobile/ --project=chromium --device="${{ matrix.device }}"
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001

  # 🎨 VISUAL REGRESSION TESTS
  visual-regression:
    name: '🎨 Visual Regression Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: e2e-tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps

      - name: 🏗️ Build application
        run: npm run build

      - name: 🎨 Run visual regression tests
        run: npm run test:visual

      - name: 📊 Upload visual diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-diffs
          path: test-results/visual/

  # ♿ ACCESSIBILITY TESTS
  accessibility-tests:
    name: '♿ Accessibility Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps

      - name: ♿ Run accessibility tests
        run: npm run test:accessibility

      - name: 📊 Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: test-results/accessibility/

  # ⚡ PERFORMANCE TESTS
  performance-tests:
    name: '⚡ Performance Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: ⚡ Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: 📊 Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: .lighthouseci/

  # 🔒 SECURITY TESTS
  security-tests:
    name: '🔒 Security Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: foundation-tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run security tests
        run: npm run test:security

      - name: 🛡️ Security audit
        run: npm run security:scan

      - name: 📊 Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: test-results/security/

  # 🚀 LOAD TESTS
  load-tests:
    name: '🚀 Load Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: performance-tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run K6 load tests
        run: npm run test:load
        env:
          K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_URL }}
          K6_PROMETHEUS_RW_USERNAME: ${{ secrets.K6_PROMETHEUS_USERNAME }}
          K6_PROMETHEUS_RW_PASSWORD: ${{ secrets.K6_PROMETHEUS_PASSWORD }}

      - name: 📊 Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: test-results/load/

  # 📊 QUALITY GATE
  quality-gate:
    name: '📊 Quality Gate'
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, accessibility-tests, performance-tests, security-tests]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📊 Check test coverage
        run: |
          npm run coverage:report
          # Check if coverage meets thresholds
          npx istanbul check-coverage \
            --statements 95 \
            --branches 95 \
            --functions 95 \
            --lines 95

      - name: 📊 Generate quality report
        run: |
          echo "## 🧪 Test Quality Report" >> quality-report.md
          echo "- **Unit Test Coverage**: $(jq '.total.statements.pct' coverage/coverage-summary.json)%" >> quality-report.md
          echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> quality-report.md
          echo "- **E2E Tests**: ${{ needs.e2e-tests.result }}" >> quality-report.md
          echo "- **Accessibility**: ${{ needs.accessibility-tests.result }}" >> quality-report.md
          echo "- **Performance**: ${{ needs.performance-tests.result }}" >> quality-report.md
          echo "- **Security**: ${{ needs.security-tests.result }}" >> quality-report.md

      - name: 📊 Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.md

      - name: 🚫 Fail if quality gates not met
        run: |
          # Check if all required jobs passed
          if [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.integration-tests.result }}" != "success" ]] ||
             [[ "${{ needs.e2e-tests.result }}" != "success" ]] ||
             [[ "${{ needs.accessibility-tests.result }}" != "success" ]] ||
             [[ "${{ needs.performance-tests.result }}" != "success" ]] ||
             [[ "${{ needs.security-tests.result }}" != "success" ]]; then
            echo "❌ Quality gates failed"
            exit 1
          fi

  # 🚀 DEPLOYMENT
  deploy:
    name: '🚀 Deploy'
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add your deployment commands here
          # npm run deploy:prod

  # 📈 METRICS & MONITORING
  metrics:
    name: '📈 Test Metrics & Monitoring'
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, performance-tests]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Collect test metrics
        run: |
          # Collect coverage metrics
          COVERAGE=$(jq '.total.statements.pct' coverage/coverage-summary.json)
          echo "Test Coverage: ${COVERAGE}%"

          # Collect performance metrics
          if [ -f ".lighthouseci/lhr-*.json" ]; then
            PERFORMANCE=$(jq '.categories.performance.score * 100' .lighthouseci/lhr-*.json)
            echo "Performance Score: ${PERFORMANCE}"
          fi

          # Send metrics to monitoring service
          # curl -X POST ${{ secrets.METRICS_ENDPOINT }} \
          #   -H "Content-Type: application/json" \
          #   -d "{\"coverage\": ${COVERAGE}, \"performance\": ${PERFORMANCE}}"

      - name: 📊 Generate test summary
        run: |
          echo "## 🧪 Test Execution Summary" >> test-summary.md
          echo "- **Total Tests**: $(find test-results -name "*.json" -exec jq '.numTotalTests' {} \; | paste -sd+ | bc)" >> test-summary.md
          echo "- **Passed Tests**: $(find test-results -name "*.json" -exec jq '.numPassedTests' {} \; | paste -sd+ | bc)" >> test-summary.md
          echo "- **Failed Tests**: $(find test-results -name "*.json" -exec jq '.numFailedTests' {} \; | paste -sd+ | bc)" >> test-summary.md
          echo "- **Duration**: $(find test-results -name "*.json" -exec jq '.duration' {} \; | paste -sd+ | bc)ms" >> test-summary.md

      - name: 📊 Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md

  # 🔄 DEPENDENCY UPDATES
  dependency-updates:
    name: '🔄 Dependency Updates'
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔄 Update dependencies
        run: |
          npm update
          npm audit fix

      - name: 🧪 Run tests after updates
        run: npm run test:all

      - name: 📝 Create update PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/dependency-updates
          title: '🔄 Automated Dependency Updates'
          body: 'Automated dependency updates with test verification'
          commit-message: 'chore: update dependencies'

  # 📢 NOTIFICATIONS
  notifications:
    name: '📢 Test Notifications'
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, quality-gate]
    if: always()

    steps:
      - name: 📢 Notify on failure
        if: failure()
        run: |
          echo "❌ Tests failed!"
          # Send notification to Slack, Discord, etc.
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   -d '{"text":"🚨 Tests failed on ${{ github.ref }}"}'

      - name: 📢 Notify on success
        if: success()
        run: |
          echo "✅ All tests passed!"
          # Send success notification
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   -d '{"text":"🎉 All tests passed on ${{ github.ref }}"}'

# 🎯 QUALITY GATES
# All tests must pass with minimum coverage requirements
# Performance must meet Lighthouse thresholds
# Security scans must pass
# Accessibility must meet WCAG 2.1 AA standards
